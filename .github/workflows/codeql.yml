name: codeql
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "33 4 * * 6" }]
permissions: { contents: read, security-events: write }
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: { matrix: { language: [javascript-typescript, python] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
