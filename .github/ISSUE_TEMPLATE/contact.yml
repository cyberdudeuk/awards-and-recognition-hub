name: Contact
description: Ask a question or get in touch with the service owner. This form is public.
title: "Contact: "
labels: ["contact", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy notice.** What you write here is public on GitHub. Do not include your name, contact details, or anyone else's personal details.
        The service owner uses what you write only to reply here. You can delete your issue at any time.
  - type: textarea
    id: message
    attributes:
      label: Your message
      description: What would you like to ask or tell us?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I have not included personal details about myself or anyone else.
          required: true
