name: Report a problem
description: Something on the Hub is broken, wrong or hard to use.
title: "Bug: "
labels: ["bug", "triage"]
body:
  - type: input
    id: page
    attributes: { label: "Which page?", description: "Copy the address, for example …/#calendar-agenda" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: "What happened, and what did you expect?" }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: "Browser and device (optional)", description: "For example Edge on Windows, Safari on iPhone. Mention any assistive technology." }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal details. This issue is public.
          required: true
