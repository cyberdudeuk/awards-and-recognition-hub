name: Suggest an idea
description: An idea or wishlist item for the Hub.
title: "Idea: "
labels: ["idea", "triage"]
body:
  - type: textarea
    id: need
    attributes: { label: "What do you need to do?", description: "Describe the task or problem, not the solution." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "Your idea (optional)" }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal details. This issue is public.
          required: true
