name: Content correction
description: A fact, rule or wording on the Hub is wrong or out of date.
title: "Correction: "
labels: ["content", "triage"]
body:
  - type: input
    id: page
    attributes: { label: "Which page?" }
    validations: { required: true }
  - type: textarea
    id: wrong
    attributes: { label: "What is wrong, and what should it say?" }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: "Official source (HTTPS link)", description: "An organiser or official page that shows the correct fact." }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal details. This issue is public.
          required: true
