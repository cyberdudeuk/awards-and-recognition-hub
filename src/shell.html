  --h0s:#F7E3EC; --h1s:#E3ECFA; --h2s:#E1F2E8; --h3s:#EFE6F8; --h4s:#FBEBD6; --h5s:#DCF1F3; --h6s:#E6E7FA; --h7s:#E2E8F1; --sec:var(--accent); --sec-soft:var(--accent-soft) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --h0:#F07AAA; --h1:#8DB0F0; --h2:#5CC48A; --h3:#B48BEA; --h4:#F0A54A; --h5:#4FC3CF; --h6:#A0A6F5; --h7:#9DB8E0;
  --h0s:#3A1426; --h1s:#17243F; --h2s:#14301F; --h3s:#2A1D40; --h4s:#38260F; --h5s:#0F2E33; --h6s:#1E2147; --h7s:#1A2740 }}
:root[data-theme="dark"]{ --h0:#F07AAA; --h1:#8DB0F0; --h2:#5CC48A; --h3:#B48BEA; --h4:#F0A54A; --h5:#4FC3CF; --h6:#A0A6F5; --h7:#9DB8E0;
  --h0s:#3A1426; --h1s:#17243F; --h2s:#14301F; --h3s:#2A1D40; --h4s:#38260F; --h5s:#0F2E33; --h6s:#1E2147; --h7s:#1A2740 }
body[data-hue="0"]{--sec:var(--h0);--sec-soft:var(--h0s)} body[data-hue="1"]{--sec:var(--h1);--sec-soft:var(--h1s)} body[data-hue="2"]{--sec:var(--h2);--sec-soft:var(--h2s)} body[data-hue="3"]{--sec:var(--h3);--sec-soft:var(--h3s)}
body[data-hue="4"]{--sec:var(--h4);--sec-soft:var(--h4s)} body[data-hue="5"]{--sec:var(--h5);--sec-soft:var(--h5s)} body[data-hue="6"]{--sec:var(--h6);--sec-soft:var(--h6s)} body[data-hue="7"]{--sec:var(--h7);--sec-soft:var(--h7s)}
[data-hue="0"]{--hc:var(--h0);--hcs:var(--h0s)} [data-hue="1"]{--hc:var(--h1);--hcs:var(--h1s)} [data-hue="2"]{--hc:var(--h2);--hcs:var(--h2s)} [data-hue="3"]{--hc:var(--h3);--hcs:var(--h3s)}
[data-hue="4"]{--hc:var(--h4);--hcs:var(--h4s)} [data-hue="5"]{--hc:var(--h5);--hcs:var(--h5s)} [data-hue="6"]{--hc:var(--h6);--hcs:var(--h6s)} [data-hue="7"]{--hc:var(--h7);--hcs:var(--h7s)}
.mast{position:sticky} .mast::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--h0),var(--h4),var(--h2),var(--h5),var(--h1),var(--h6),var(--h3)); pointer-events:none}
.sechead::after{background:linear-gradient(90deg, var(--sec), var(--gilt))}
.secbadge{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px; background:var(--sec-soft); color:var(--sec); margin-right:6px; vertical-align:-6px}
.secbadge .ico{width:14px; height:14px}
.tabs button[aria-selected="true"]{color:var(--sec); border-bottom-color:var(--sec)}
.tabs button[aria-selected="true"] .ico{color:var(--sec)}
.dsec > button[aria-current="true"]{background:var(--sec-soft); color:var(--sec)}
.dsec > button[aria-current="true"] .flag{color:var(--sec)}
.dsec > button .count{background:var(--sec-soft); color:var(--sec); border-radius:10px; padding:0 7px; font-weight:700}
#gnav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--sec)}
.card[data-hue]{border-top:3px solid var(--hc)}
.card[data-hue]:hover{border-color:color-mix(in srgb, var(--hc) 45%, var(--rule)); border-top-color:var(--hc)}
.cico{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--hcs,var(--sec-soft)); color:var(--hc,var(--sec)); margin-right:8px; vertical-align:middle; flex:none}
.cico .ico{width:17px; height:17px} .cico-top{margin-bottom:4px}
.withico{display:flex; align-items:center; gap:0; flex-wrap:wrap}
summary.withico{display:list-item} summary.withico .cico{margin-left:4px}
.card .ico.big{width:34px; height:34px; padding:7px; border-radius:10px; background:var(--hcs); color:var(--hc); box-sizing:content-box}
.tblwrap[data-hue] thead th{background:var(--hcs); border-bottom:2px solid var(--hc)}
.tblwrap[data-hue] thead th button{color:var(--ink)}
.kpi{border-top:3px solid var(--sec)} .kpi[data-hue]{border-top-color:var(--hc); border-left-color:var(--hc)} .kpi[data-hue] svg.ico{color:var(--hc)}
/* overflow guard */
#view, #panel, .card, .note, .stack, .grid > *{min-width:0}
#view img, #view svg:not(.ico), #view video, #view canvas{max-width:100%; height:auto}
#view pre{max-width:100%; overflow-x:auto} #view p, #view li, #view td, #view dd, .card{overflow-wrap:anywhere}
.tblwrap{max-width:100%; overflow-x:auto}
#view input, #view select, #view textarea{max-width:100%}
/* tab scroller */
.tabswrap{position:relative; display:flex; align-items:stretch; min-width:0; max-width:100%}
.tabswrap .tabs{flex:1 1 auto; scroll-behavior:smooth; scrollbar-width:none} .tabswrap .tabs::-webkit-scrollbar{display:none}
.tabswrap.over .tabs{mask-image:linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%)}
.tabnav{flex:none; width:34px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); border-radius:6px; cursor:pointer; display:grid; place-items:center; margin:2px}
.tabnav:hover{color:var(--sec); border-color:var(--sec)}
/* send buttons */
.sharebtn{margin-top:8px} .sharebtn .ico{color:currentColor}
.sharebox{max-width:min(760px, calc(100vw - 24px)); max-height:calc(100vh - 40px); overflow:auto}
.sharebox .fld{display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:.9rem}
.sharebox input, .sharebox textarea, .sharebox select{font:inherit; font-weight:400; padding:8px; border:1px solid var(--rule); border-radius:4px; background:var(--surface); color:var(--ink); width:100%}
.sharebox .chk{display:flex; gap:8px; align-items:flex-start; font-weight:600}
.shgroup{display:flex; flex-direction:column; gap:6px}
.shrow{display:flex; flex-wrap:wrap; gap:6px}
.shact{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:18px; border:1px solid var(--rule); background:var(--surface); color:var(--ink); font:600 .85rem var(--f-display); text-decoration:none; cursor:pointer}
.shact .ico{width:16px; height:16px; color:var(--h5)}
.shgroup[data-g="Microsoft 365"] .shact .ico{color:var(--h1)} .shgroup[data-g="Google Workspace"] .shact .ico{color:var(--h2)} .shgroup[data-g="Slack"] .shact .ico{color:var(--h3)} .shgroup[data-g="Any app"] .shact .ico{color:var(--h4)}
.shact:hover{border-color:var(--sec); color:var(--ink)} .shact[aria-disabled="true"]{opacity:.55; cursor:not-allowed}
.shact .flag{margin-left:2px}
/* connect hub */
.cxhero{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:20px; align-items:center; padding:22px; border-radius:var(--r); border:1px solid color-mix(in srgb, var(--h5) 35%, var(--rule)); background:linear-gradient(115deg, var(--h5s), var(--surface) 55%, var(--h1s))}
.cxhero-t{font:800 1.35rem var(--f-display); margin:0}
.cxorbit{position:relative; aspect-ratio:1; max-width:220px; width:100%; justify-self:center}
.orb{position:absolute; display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:var(--surface); border:2px solid currentColor; box-shadow:0 4px 12px rgba(0,0,0,.08)}
.orb .ico{width:20px; height:20px}
.orb.core{left:calc(50% - 30px); top:calc(50% - 30px); width:60px; height:60px; color:var(--h0)} .orb.core .ico{width:28px; height:28px}
.orb.o0{left:calc(50% - 21px); top:0; color:var(--h1)} .orb.o1{right:6%; top:14%; color:var(--h2)} .orb.o2{right:0; top:calc(50% - 21px); color:var(--h3)} .orb.o3{right:6%; bottom:14%; color:var(--h4)}
.orb.o4{left:calc(50% - 21px); bottom:0; color:var(--h5)} .orb.o5{left:6%; bottom:14%; color:var(--h6)} .orb.o6{left:0; top:calc(50% - 21px); color:var(--h7)} .orb.o7{left:6%; top:14%; color:var(--h0)}
.launchcard{text-align:left; cursor:pointer; font:inherit; color:var(--ink); align-items:flex-start}
.launchcard:hover{box-shadow:0 10px 26px color-mix(in srgb, var(--hc) 20%, transparent); transform:translateY(-2px)}
.flowfig svg{width:100%; height:auto} .flbox{stroke-width:2} .fl-a{fill:var(--h1s);stroke:var(--h1)} .fl-b{fill:var(--h2s);stroke:var(--h2)} .fl-c{fill:var(--h3s);stroke:var(--h3)} .fl-d{fill:var(--h4s);stroke:var(--h4)}
.fl-t{font:800 15px var(--f-display); fill:var(--ink)} .fl-s{font:500 12px var(--f-body); fill:var(--muted)} .fl-arrow path{fill:none; stroke:var(--muted); stroke-width:2}
.rulechip{font:800 .78rem var(--f-mono); background:var(--hc,var(--sec)); color:var(--surface); padding:2px 7px; border-radius:4px}
.recipe summary{cursor:pointer} .integ .eyebrow{color:var(--muted)}
.sitemap .smlist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:4px}
.sitemap .smlist a{display:inline-flex; gap:6px; align-items:center} .sitemap .smlist .ico{width:15px; height:15px; color:var(--hc)}
.footmap{display:flex; flex-wrap:wrap; gap:4px 6px}
@media (max-width:760px){ .cxhero{grid-template-columns:minmax(0,1fr)} .cxorbit{max-width:170px} }
@media (max-width:1100px){ #chkBadgeText{display:none} }
@media (max-width:900px){ .slabel, .tlabel{display:none} }

.moremenu .menuitem{display:flex; gap:8px; align-items:center; width:100%; background:none; border:0; padding:8px 12px; font:inherit; color:var(--ink); cursor:pointer; text-align:left} .moremenu .menuitem:hover{background:var(--sec-soft); color:var(--sec)}
html.acc-text .cico, html.acc-text .secbadge, html.acc-text .cxorbit{display:none!important}
html.acc-contrast .card[data-hue]{border-top:2px solid #fff} html.acc-contrast .cico, html.acc-contrast .secbadge{background:#000; color:#FFDD00; border:1px solid #fff}
@media print{ .mast, .drawer, .askfab, .signpost, .feedback, .tabswrap, .sharebtn, #staleBanner, .onpage{display:none!important} .frame{display:block!important} body{background:#fff; color:#000} .card{break-inside:avoid; box-shadow:none} a[href^="http"]::after{content:" (" attr(href) ")"; font-size:.8em} }

/* ===== Release 8: liquid glass, fluid design, splash, carousel, quick launch, spotlight, media ===== */
:root{ --glass:color-mix(in srgb, var(--surface) 82%, transparent); --glass-b:color-mix(in srgb, #fff 55%, transparent); --glass-sh:0 10px 34px color-mix(in srgb, var(--navy) 14%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 70%, transparent) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --glass:color-mix(in srgb, var(--surface) 80%, transparent); --glass-b:color-mix(in srgb, #fff 14%, transparent); --glass-sh:0 12px 36px rgba(0,0,0,.35), inset 0 1px 0 color-mix(in srgb, #fff 10%, transparent) }}
:root[data-theme="dark"]{ --glass:color-mix(in srgb, var(--surface) 80%, transparent); --glass-b:color-mix(in srgb, #fff 14%, transparent); --glass-sh:0 12px 36px rgba(0,0,0,.35), inset 0 1px 0 color-mix(in srgb, #fff 10%, transparent) }
body{font-size:clamp(15px, 14.2px + .22vw, 17px)}
h1{font-size:clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem)}
body::after{content:""; position:fixed; inset:-20vmax; z-index:-1; pointer-events:none; background:
  radial-gradient(40vmax 30vmax at 12% 18%, color-mix(in srgb, var(--h1) 14%, transparent), transparent 70%),
  radial-gradient(36vmax 28vmax at 88% 12%, color-mix(in srgb, var(--h0) 12%, transparent), transparent 70%),
  radial-gradient(42vmax 32vmax at 70% 88%, color-mix(in srgb, var(--h5) 12%, transparent), transparent 70%),
  radial-gradient(34vmax 26vmax at 18% 92%, color-mix(in srgb, var(--h3) 10%, transparent), transparent 70%); animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{ from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(2vmax,-2vmax,0) scale(1.06)} }
.glass, .card, .kpi, .drawer, .mast, .tabswrap .tabs, .onpage, .sbox{background:var(--glass); -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%)}
.glass{border:1px solid var(--glass-b); border-radius:18px; box-shadow:var(--glass-sh)}
.card{border-radius:14px; box-shadow:var(--glass-sh)}
.mast{background:color-mix(in srgb, var(--navy) 88%, transparent)}
@media (prefers-reduced-transparency: reduce){ .glass, .card, .kpi, .drawer, .mast, .tabswrap .tabs, .onpage, .sbox{background:var(--surface); -webkit-backdrop-filter:none; backdrop-filter:none} .mast{background:var(--navy)} }
html.acc-contrast .glass, html.acc-contrast .card, html.acc-contrast .kpi{background:#000; backdrop-filter:none; box-shadow:none}
html.acc-contrast body::after, html.acc-text body::after, html.acc-motion body::after{animation:none} html.acc-contrast body::after, html.acc-text body::after{display:none}
html.acc-text .glass, html.acc-text .card{backdrop-filter:none; box-shadow:none; background:var(--surface)}
.blobs{position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none}
.blobs i{position:absolute; width:46%; aspect-ratio:1; border-radius:50%; filter:blur(36px); opacity:.55; animation:blob 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--h0); left:-10%; top:-20%} .blobs i:nth-child(2){background:var(--h1); right:-12%; top:-10%; animation-delay:-4s} .blobs i:nth-child(3){background:var(--h5); left:20%; bottom:-30%; animation-delay:-8s} .blobs i:nth-child(4){background:var(--h3); right:5%; bottom:-25%; animation-delay:-12s}
@keyframes blob{ from{transform:translate(0,0) scale(1)} to{transform:translate(8%,6%) scale(1.15)} }
@media (prefers-reduced-motion: reduce){ body::after, .blobs i, .splash .splogo{animation:none!important} }
html.acc-motion .blobs i{animation:none}
/* splash */
.splash{position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:16px; background:color-mix(in srgb, var(--paper) 70%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); transition:opacity .4s ease}
.splash.out{opacity:0}
.splashcard{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:34px 28px; max-width:min(520px, 100%)}
.splashcard h2{font:800 clamp(1.5rem, 1.1rem + 2vw, 2.2rem) var(--f-display); margin:6px 0 0}
.splogo{animation:spin-in 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin-in{ from{transform:scale(.6) rotate(-90deg); opacity:0} to{transform:none; opacity:1} }
.splash.still .splogo{animation:none}
/* front page */
.front{display:flex; flex-direction:column; gap:18px}
.fhero{position:relative; overflow:hidden; padding:clamp(20px, 3vw, 40px)}
.fhero-in{position:relative; display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.fhero-t{font:800 clamp(1.6rem, 1.1rem + 2.4vw, 2.8rem)/1.1 var(--f-display); margin:4px 0}
.logo{flex:none}
.quick{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,128px),1fr)); gap:8px; padding:10px}
.qa{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border-radius:12px; text-decoration:none; color:var(--ink); font:600 .86rem var(--f-display); text-align:center; background:none; border:1px solid transparent; cursor:pointer}
.qa .ico{width:26px; height:26px; padding:8px; box-sizing:content-box; border-radius:12px; background:var(--sec-soft); color:var(--sec)}
.qa:nth-child(8n+1) .ico{background:var(--h0s); color:var(--h0)} .qa:nth-child(8n+2) .ico{background:var(--h1s); color:var(--h1)} .qa:nth-child(8n+3) .ico{background:var(--h2s); color:var(--h2)} .qa:nth-child(8n+4) .ico{background:var(--h3s); color:var(--h3)} .qa:nth-child(8n+5) .ico{background:var(--h4s); color:var(--h4)} .qa:nth-child(8n+6) .ico{background:var(--h5s); color:var(--h5)} .qa:nth-child(8n+7) .ico{background:var(--h6s); color:var(--h6)} .qa:nth-child(8n+8) .ico{background:var(--h7s); color:var(--h7)}
.qa:hover{border-color:var(--glass-b); background:color-mix(in srgb, var(--surface) 60%, transparent); color:var(--ink)}
/* carousel */
.car{position:relative; padding:clamp(16px, 2.4vw, 28px); overflow:hidden}
.car-ctl{position:absolute; top:12px; right:12px; display:flex; gap:6px; z-index:2}
.car-slide{display:grid; grid-template-columns:minmax(0,180px) minmax(0,1fr); gap:clamp(14px,2vw,28px); align-items:center; min-height:200px}
.car-art{position:relative; aspect-ratio:1; display:grid; place-items:center; color:#fff}
.art-blob{position:absolute; inset:6%; border-radius:42% 58% 63% 37% / 41% 44% 56% 59%; background:linear-gradient(135deg, var(--hc), color-mix(in srgb, var(--hc) 45%, var(--h5))); box-shadow:0 18px 40px color-mix(in srgb, var(--hc) 35%, transparent); animation:morph 12s ease-in-out infinite alternate}
@keyframes morph{ from{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%} to{border-radius:58% 42% 37% 63% / 56% 59% 41% 44%} }
html.acc-motion .art-blob{animation:none} @media (prefers-reduced-motion: reduce){ .art-blob{animation:none} }
.car-art .ico{position:relative; width:56px; height:56px; stroke-width:1.6}
:root[data-theme="dark"] .car-art{color:#0E1422} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .car-art{color:#0E1422} }
.car-body{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding-right:110px}
.car-t{font:800 clamp(1.2rem, 1rem + 1vw, 1.7rem)/1.2 var(--f-display); margin:0}
.chipk{display:inline-block; font:700 .72rem var(--f-display); letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:20px; background:var(--hcs,var(--sec-soft)); color:var(--hc,var(--sec))}
.car-dots{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap}
.car-dots{gap:2px}
.car-dots .dot{position:relative; width:24px; height:24px; border:0; background:none; padding:0; cursor:pointer; display:grid; place-items:center}
.car-dots .dot::before{content:""; width:12px; height:12px; border-radius:50%; border:2px solid var(--muted); box-sizing:border-box}
.car-dots .dot.on{width:36px} .car-dots .dot.on::before{background:var(--sec); border-color:var(--sec); width:28px; border-radius:8px}
@media (max-width:640px){ .car-slide{grid-template-columns:minmax(0,1fr)} .car-art{max-width:120px} .car-body{padding-right:0} .car-ctl{position:static; justify-content:flex-end; margin-bottom:8px} }
/* quick actions fab */
.qfab{position:fixed; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(max(18px, env(safe-area-inset-bottom,0px)) + 62px); z-index:75; display:inline-flex; align-items:center; gap:6px; border-radius:24px; padding:9px 14px; font:700 .86rem var(--f-display); cursor:pointer; color:var(--ink); background:var(--glass); border:1px solid var(--glass-b); box-shadow:var(--glass-sh); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.qfab .ico{color:var(--h4)}
.qmenu{position:fixed; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(max(18px, env(safe-area-inset-bottom,0px)) + 112px); z-index:76; display:flex; flex-direction:column; padding:8px; min-width:230px; max-height:min(70vh, 520px); overflow:auto}
.qmenu [role=menuitem]{display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:10px; color:var(--ink); text-decoration:none; background:none; border:0; font:inherit; text-align:left; cursor:pointer}
.qmenu [role=menuitem]:hover, .qmenu [role=menuitem]:focus{background:var(--sec-soft); color:var(--sec)}
@media (max-width:640px){ .qfab span{display:none} }
/* spotlight */
.spothero{position:relative; display:flex; gap:20px; align-items:center; justify-content:space-between; padding:clamp(18px,2.6vw,30px); flex-wrap:wrap}
.spotcard{text-align:left; font:inherit; color:var(--ink); cursor:pointer; align-items:flex-start}
.spotcard:hover{transform:translateY(-2px); box-shadow:0 14px 34px color-mix(in srgb, var(--hc) 22%, transparent)}
.avatar{display:grid; place-items:center; width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg, var(--hc,var(--sec)), color-mix(in srgb, var(--hc,var(--sec)) 50%, var(--h5))); color:#fff}
.avatar .ico{width:24px; height:24px} .avatar.big{width:72px; height:72px} .avatar.big .ico{width:36px; height:36px}
:root[data-theme="dark"] .avatar{color:#0E1422} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .avatar{color:#0E1422} }
